        }

        ::selection {

        }

        #browser-compatibility {
            display: none;
            position: absolute;
            width: 275px;
            margin-top: -58px;
            margin-left: -137px;
            top: 40%;
            left: 50%;
            background: #fff;
            text-align: center;
        }

        .about {
            position: fixed;
            bottom: 0;
            right: 0;
            color: #fff;
            z-index: -1;
            margin: 0;
            display: none;
            flex-direction: row;
        }

        @media all and (display-mode: fullscreen) {
            .about {
                display: none;
            }
        }

        .about.loaded,
        .about a {
            display: flex;
        }

        .about a svg {
            margin: 10px 13px;
            width: 16px;
            height: 16px;
            fill: #fff;
            transition: 0.25s ease-out;
        }

        .about a:before {
            position: absolute;
            top: 0;
            content: "";
            width: 42px;
            height: 2px;
            background-color: #fff0;
            transition: 0.25s ease-out;
        }

        .about a:hover:before {
            background-color: #fff;
            transition: 0.25s ease-out;
        }

        .about a:hover svg {
            transition: 0.25s ease-out;
            transform: scale(1.35);
        }

        #github-share {
            background-color: #2d3238;
        }

        #music-credits {
            background-color: #598dc5;
        }

        #butterchurn-share {
            display: none;
            background-size: 100%;
        }

        #app {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            z-index: -2;
        }

        #app #loading {
            color: #fff;
            text-align: center;
            font-size: 40px;
            height: 30px;
            position: absolute;
            margin: auto;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
        }

        #app #loading .ellipsis-anim span {
            opacity: 0;
            -webkit-animation: ellipsis-dot 1s infinite;
            animation: ellipsis-dot 1s infinite;
        }

        #app #loading .ellipsis-anim span:nth-child(1) {
            -webkit-animation-delay: 0s;
            animation-delay: 0s;
        }

        #app #loading .ellipsis-anim span:nth-child(2) {
            -webkit-animation-delay: 0.1s;
            animation-delay: 0.1s;
        }

        #app #loading .ellipsis-anim span:nth-child(3) {
            -webkit-animation-delay: 0.2s;
            animation-delay: 0.2s;
        }

        @-webkit-keyframes ellipsis-dot {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @keyframes ellipsis-dot {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .desktop-icon {
            text-align: center;
            cursor: pointer;
            image-rendering: pixelated;
        }

        .desktop-icon-title {
            color: #fff;
            font-family: "MS Sans Serif", Segoe UI, sans-serif;
            font-size: 11px;
            -webkit-font-smoothing: none;
            margin-top: 5px;
            width: 100%;
            border: 1px dotted transparent;
            text-overflow: ellipsis;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .desktop-icon.selected .desktop-icon-title {
            background-color: navy;
            border-color: #fff;
        }

        .desktop-icon.selected img {
            filter: brightness(0.35) sepia(100%) hue-rotate(148deg) saturate(10);
        }

        // Transform skin URLs
        function transformUrl(url) {
            if (typeof url !== 'string' || !url.startsWith("https://skins.webamp.org/skin/")) {
                console.error("Invalid URL:", url);
                return null;
            }

            const urlParts = url.split("/");
            if (urlParts.length < 6) {
                console.error("Unexpected URL format:", url);
                return null;
            }

            const id = urlParts[4];
            const fileName = urlParts[5];
            const name = fileName.split(".")[0];

            return {
                url: `https://cdn.webampskins.org/skins/${id}.wsz`,
                name: name
            };
        }

        function transformUrls(urls) {
            return urls.map(transformUrl).filter(urlObj => urlObj !== null);
        }

        function getRandomSkinUrl(skins) {
            if (skins.length === 0) return null;
            const randomIndex = Math.floor(Math.random() * skins.length);
            return skins[randomIndex].url;
        }

        function randomizeList(arr) {
            const shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Initialize WebAmp after the DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            const skins = transformUrls(randomizeList(skinList));
            const app = document.getElementById("app");

            const options = {
                initialTracks: initialTracks,
                windowLayout: {
                    main: {
                        position: { left: 0, top: 10 }
                    },
                    equalizer: {
                        closed: false,
                        position: { left: 0, top: 115 }
                    },
                    playlist: {
                        closed: false,
                        position: { left: 0, top: 230 }
                    },
                    milkdrop: {
                        closed: false,
                        position: { left: 0, top: 232 },
                        size: {
                            extraHeight: 11,
                            extraWidth: 11,
                        }
                    }
                },
                initialSkin: {
                    url: getRandomSkinUrl(skins)
                },
                availableSkins: skins,
                enableDoubleSizeMode: false,
                enableHotkeys: true,
                zIndex: 99999,
                filePickers: [],
                requireJSZip: true // Add this line to explicitly require JSZip
            };

            try {
                // Check if Webamp is defined
                if (typeof Webamp !== 'undefined') {
                    const webamp = new Webamp(options);
                    webamp.renderWhenReady(app).catch(error => {
                        console.error('Failed to render Webamp:', error);
                    });
                } else {
                    console.error('Webamp is not defined. Check script loading order.');
                }
            } catch (error) {
                console.error('Error creating Webamp instance:', error);
            }
        });
