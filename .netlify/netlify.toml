# Force Netlify to use these settings
[site]
  id = "6df47b6f-6792-4a74-8bb0-e2f4c41d2651"
  name = "macosxjs"

[build]
  # Force these settings
  command = "npm run build"
  publish = "dist"
  base = "/"

# Disable any UI settings overriding
[settings]
  # Don't inherit from UI
  inherit = false

# Explicit build environment
[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Add headers to ensure proper caching
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"