# For a simple static HTML site (no build needed)
[site]
  id = "6df47b6f-6792-4a74-8bb0-e2f4c41d2651"
  name = "macosxjs"

[build]
  # NO build command needed for static HTML
  command = "echo 'Static site - no build required'"
  # Point directly to the folder containing your index.html
  publish = "."

# Optional: Add redirects if needed
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200